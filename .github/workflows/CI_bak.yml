name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: "PHP ${{ matrix.php }} • deps:${{ matrix.deps }} • cm:${{ matrix.commonmark }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        include:
          # LOW (prefer-lowest) on CommonMark 2.x
          - deps: low
            commonmark: '^2.4'
            php: '8.3'
          - deps: low
            commonmark: '^2.4'
            php: '8.4'
          # HIGH (latest stable) on CommonMark 3.x
          - deps: high
            commonmark: '^3.0'
            php: '8.3'
          - deps: high
            commonmark: '^3.0'
            php: '8.4'
          # NEXT (dev-main) on latest PHPs
          - deps: next
            commonmark: 'dev-main'
            php: '8.3'
          - deps: next
            commonmark: 'dev-main'
            php: '8.4'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: |
            ~/.composer/cache
            vendor
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.deps }}-${{ matrix.commonmark }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-${{ matrix.php }}-${{ matrix.deps }}-${{ matrix.commonmark }}-
            composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Pin league/commonmark constraint
        run: composer require --no-interaction --no-update league/commonmark:${{ matrix.commonmark }}

      - name: Configure stability for next/dev
        if: matrix.deps == 'next'
        run: |
          composer config minimum-stability dev
          composer config prefer-stable true

      - name: Install (prefer-lowest)
        if: matrix.deps == 'low'
        run: composer update --prefer-dist --no-interaction --prefer-lowest --prefer-stable

      - name: Install (latest stable)
        if: matrix.deps == 'high'
        run: composer update --prefer-dist --no-interaction

      - name: Install (next/dev)
        if: matrix.deps == 'next'
        run: composer update --prefer-dist --no-interaction

      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: PHPStan
        if: success()
        run: vendor/bin/phpstan analyse --no-progress
